#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # Temporary debug job for Windows SIGSEGV investigation
  windows-debug-test:
    name: Windows Debug Build for SIGSEGV Investigation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.5
        with:
          vcpkgGitCommitId: 5e5d0e1cd7785623065e77eff011afdeec1a3574
      
      - name: Build extension in debug mode
        shell: bash
        run: |
          cd duckdb
          make debug
          cd ..
          make debug
      
      - name: Find and list debug build artifacts
        shell: bash
        run: |
          echo "=== Searching for unittest executable ==="
          find . -name "unittest*" -type f 2>/dev/null || echo "No unittest found with find"
          echo "=== Checking duckdb build directory ==="
          ls -la duckdb/build/ 2>/dev/null || echo "No duckdb/build directory"
          echo "=== Checking for Windows-style paths ==="
          ls -la duckdb/build/debug/ 2>/dev/null || echo "No duckdb/build/debug directory"
          ls -la build/ 2>/dev/null || echo "No local build directory"
          ls -la build/debug/ 2>/dev/null || echo "No local build/debug directory"
      
      - name: Test with debug symbols and verbose output
        shell: bash
        continue-on-error: true
        run: |
          echo "=== Attempting to find and run unittest ==="
          # Try different possible locations for the unittest executable (Windows has Debug subdirectory)
          if [ -f "build/debug/test/Debug/unittest.exe" ]; then
            echo "Found unittest.exe in build/debug/test/Debug/ (Windows Visual Studio path)"
            ./build/debug/test/Debug/unittest.exe "*http_sqlite*" --durations yes --verbosity high
          elif [ -f "duckdb/build/debug/test/Debug/unittest.exe" ]; then
            echo "Found unittest.exe in duckdb/build/debug/test/Debug/"
            cd duckdb
            ./build/debug/test/Debug/unittest.exe "*http_sqlite*" --durations yes --verbosity high
          elif [ -f "duckdb/build/debug/test/unittest.exe" ]; then
            echo "Found unittest.exe in duckdb/build/debug/test/"
            cd duckdb
            ./build/debug/test/unittest.exe "*http_sqlite*" --durations yes --verbosity high
          elif [ -f "duckdb/build/debug/test/unittest" ]; then
            echo "Found unittest in duckdb/build/debug/test/"
            cd duckdb
            ./build/debug/test/unittest "*http_sqlite*" --durations yes --verbosity high
          elif [ -f "build/debug/test/unittest.exe" ]; then
            echo "Found unittest.exe in build/debug/test/"
            ./build/debug/test/unittest.exe "*http_sqlite*" --durations yes --verbosity high
          elif [ -f "build/debug/test/unittest" ]; then
            echo "Found unittest in build/debug/test/"
            ./build/debug/test/unittest "*http_sqlite*" --durations yes --verbosity high
          else
            echo "ERROR: Could not find unittest executable in any expected location"
            echo "=== Directory structure debug ==="
            find . -name "*unittest*" -type f 2>/dev/null || echo "No unittest files found anywhere"
            exit 1
          fi
          
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.3.0
    with:
      duckdb_version: v1.3.0
      extension_name: sqlite_scanner
      ci_tools_version: v1.3.0

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.3.0
    secrets: inherit
    with:
      duckdb_version: v1.3.0
      extension_name: sqlite_scanner
      ci_tools_version: v1.3.0
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
