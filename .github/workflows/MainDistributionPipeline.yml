#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # Temporary debug job for Windows SIGSEGV investigation
  windows-debug-test:
    name: Windows Debug Build for SIGSEGV Investigation
    runs-on: windows-2019
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-windows-static-md
      VCPKG_HOST_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      DUCKDB_PLATFORM: windows_amd64
      GEN: ninja
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Keep \n line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja build tool
        run: |
          choco install ninja -y

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ${{ github.job }}-windows_amd64-debug

      - uses: actions/checkout@v4
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: 'v1.3.0'
          repository: 'duckdb/extension-ci-tools'

      - name: Checkout DuckDB to version
        env:
          DUCKDB_GIT_VERSION: 'v1.3.0'
        run: |
          make set_duckdb_version

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: '5e5d0e1cd7785623065e77eff011afdeec1a3574'

      - name: Build extension in debug mode
        env:
          DUCKDB_PLATFORM: windows_amd64
          EXTENSION_NAME: sqlite_scanner
          EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        shell: cmd
        run: |
          call "C:/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          REM Rename link.exe to link-git.exe to avoid conflicts with git supplied linker.
          move "C:\Program Files\Git\usr\bin\link.exe" "C:\Program Files\Git\usr\bin\link-git.exe"
          make debug

      - name: Test specific http_sqlite tests with debug symbols
        shell: bash
        continue-on-error: true
        env:
          SQLITE_TPCH_GENERATED: 1
        run: |
          # Setup test database
          choco install sqlite -y
          ./build/debug/duckdb < data/sql/tpch-export.duckdb
          sqlite3 data/db/tpch.db < data/sql/tpch-create.sqlite
          
          echo "=== Running http_sqlite tests in debug mode ==="
          # Windows builds place the executable in a Debug subdirectory
          if [ -f "build/debug/test/Debug/unittest.exe" ]; then
            echo "Found unittest at: build/debug/test/Debug/unittest.exe"
            echo "Running: ./build/debug/test/Debug/unittest.exe \"*http_sqlite*\""
            ./build/debug/test/Debug/unittest.exe "*http_sqlite*"
          elif [ -f "build/debug/test/unittest.exe" ]; then
            echo "Found unittest at: build/debug/test/unittest.exe"
            echo "Running: ./build/debug/test/unittest.exe \"*http_sqlite*\""
            ./build/debug/test/unittest.exe "*http_sqlite*"
          else
            echo "ERROR: Could not find unittest executable"
            echo "Searching for unittest files:"
            find build/debug -name "unittest*" -type f
            echo "Directory structure:"
            ls -la build/debug/test/ || echo "test directory not found"
            ls -la build/debug/test/Debug/ || echo "Debug directory not found"
            exit 1
          fi
          
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.3.0
    with:
      duckdb_version: v1.3.0
      extension_name: sqlite_scanner
      ci_tools_version: v1.3.0

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.3.0
    secrets: inherit
    with:
      duckdb_version: v1.3.0
      extension_name: sqlite_scanner
      ci_tools_version: v1.3.0
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
