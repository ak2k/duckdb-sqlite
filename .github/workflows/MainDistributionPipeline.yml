#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # Quick validation job to test workflow syntax and setup
  validate-workflow:
    name: Validate Workflow Syntax
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Test bash environment
        shell: bash
        run: |
          echo "=== Testing bash environment ==="
          echo "Current directory: $(pwd)"
          echo "TEMP directory: $TEMP"
          echo "PATH: $PATH"
          
      - name: Test Windows commands from bash
        shell: bash
        run: |
          echo "=== Testing Windows command execution ==="
          # Test that we can run Windows commands
          cmd.exe /c "echo Hello from cmd.exe"
          where.exe sqlite3 || echo "sqlite3 not found in PATH"
          
      - name: Test debugging setup commands
        shell: bash
        continue-on-error: true
        run: |
          echo "=== Testing debugging setup ==="
          # Test registry access (may fail without admin)
          cmd.exe /c 'reg query "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" 2>nul' || echo "Cannot read HKLM (expected without admin)"
          
          # Test directory creation
          mkdir -p "$TEMP/CrashDumps" && echo "Successfully created temp directory"
          
          # Test timeout command
          timeout 2 echo "Timeout command works" || echo "Timeout command not available"
          
          # Test file pattern matching
          echo "Test files found:"
          ls test/sql/scanner/http_sqlite_*.test 2>/dev/null | head -5 || echo "No test files found yet"
          
      - name: Validate build tools
        shell: bash
        run: |
          echo "=== Checking build tools ==="
          where.exe cl.exe || echo "MSVC compiler not in PATH yet"
          where.exe ninja || echo "Ninja not found"
          where.exe ccache || echo "Ccache not found"
          
      - name: Summary
        shell: bash
        run: |
          echo "=== Workflow validation complete ==="
          echo "If this job succeeds, the basic workflow syntax and commands are correct."
          echo "Any warnings above are noted for the main build job."

  # Temporary debug job for Windows SIGSEGV investigation
  windows-debug-test:
    name: Windows Debug Build for SIGSEGV Investigation
    needs: validate-workflow  # Only run after validation passes
    runs-on: windows-2019
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: x64-windows-static-md
      VCPKG_HOST_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      DUCKDB_PLATFORM: windows_amd64
      GEN: ninja
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Keep \n line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja build tool
        run: |
          choco install ninja -y

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ${{ github.job }}-windows_amd64-debug

      - uses: actions/checkout@v4
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: 'v1.3.0'
          repository: 'duckdb/extension-ci-tools'

      - name: Checkout DuckDB to version
        env:
          DUCKDB_GIT_VERSION: 'v1.3.0'
        run: |
          make set_duckdb_version

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: '5e5d0e1cd7785623065e77eff011afdeec1a3574'

      - name: Build extension in debug mode
        env:
          DUCKDB_PLATFORM: windows_amd64
          EXTENSION_NAME: sqlite_scanner
          EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        shell: cmd
        run: |
          call "C:/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          REM Rename link.exe to link-git.exe to avoid conflicts with git supplied linker.
          move "C:\Program Files\Git\usr\bin\link.exe" "C:\Program Files\Git\usr\bin\link-git.exe"
          REM Enable debug symbols and assertions
          set CMAKE_BUILD_TYPE=Debug
          set DCMAKE_CXX_FLAGS_DEBUG=/MDd /Zi /Ob0 /Od /RTC1
          make debug

      - name: Test specific http_sqlite tests with debug symbols
        shell: bash
        continue-on-error: true
        env:
          SQLITE_TPCH_GENERATED: 1
        run: |
          # Setup test database
          choco install sqlite -y
          ./build/debug/duckdb < data/sql/tpch-export.duckdb
          sqlite3 data/db/tpch.db < data/sql/tpch-create.sqlite
          
          echo "=== Setting up Windows debugging environment ==="
          # Try to enable crash dumps (may fail without admin rights)
          echo "Attempting to configure Windows Error Reporting..."
          # Use cmd.exe to run reg commands since we're in bash
          cmd.exe /c 'reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /f' 2>/dev/null || echo "Note: Could not modify registry (non-admin)"
          
          # Create crash dump directory
          mkdir -p "$TEMP/CrashDumps" || true
          
          # Install debugging tools if available
          echo "Checking for debugging tools..."
          where cdb.exe || echo "cdb.exe not found - Windows Debugging Tools not installed"
          
          echo "=== Running http_sqlite tests in debug mode ==="
          # Windows builds place the executable in a Debug subdirectory
          if [ -f "build/debug/test/Debug/unittest.exe" ]; then
            UNITTEST_EXE="./build/debug/test/Debug/unittest.exe"
          elif [ -f "build/debug/test/unittest.exe" ]; then
            UNITTEST_EXE="./build/debug/test/unittest.exe"
          else
            echo "ERROR: Could not find unittest executable"
            echo "Searching for unittest files:"
            find build/debug -name "unittest*" -type f
            echo "Directory structure:"
            ls -la build/debug/test/ || echo "test directory not found"
            ls -la build/debug/test/Debug/ || echo "Debug directory not found"
            exit 1
          fi
          
          echo "Found unittest at: $UNITTEST_EXE"
          
          # First, try to run all http_sqlite tests with debugging
          echo "=========================================="
          echo "Running all http_sqlite tests together..."
          echo "=========================================="
          
          # Set environment variables for better debugging
          export DUCKDB_CRASH_ON_ASSERT=1
          export ASAN_OPTIONS=print_stats=1:check_initialization_order=1:strict_init_order=1:print_module_map=1
          
          # Run with potential debugger if available
          if command -v cdb.exe &> /dev/null; then
            echo "Running with Windows Debugger (cdb.exe)..."
            cdb.exe -g -G -lines -c "g; !analyze -v; q" "$UNITTEST_EXE" "*http_sqlite*" || true
          else
            # Run normally but capture any crash information
            $UNITTEST_EXE "*http_sqlite*" 2>&1 | tee test_output.log || EXIT_CODE=$?
            
            if [ "${EXIT_CODE:-0}" -ne 0 ]; then
              echo "Tests failed with exit code: ${EXIT_CODE}"
              
              # Check for crash dumps
              if [ -d "$TEMP/CrashDumps" ]; then
                echo "Checking for crash dumps..."
                ls -la "$TEMP/CrashDumps/" || true
              fi
              
              # Run individual tests to isolate the failure
              echo "=========================================="
              echo "Running individual tests to isolate failure..."
              echo "=========================================="
              
              for test in test/sql/scanner/http_sqlite_*.test; do
                if [ -f "$test" ]; then
                  testname=$(basename "$test")
                  echo "----------------------------------------"
                  echo "Running test: $testname"
                  echo "Command: $UNITTEST_EXE \"$test\""
                  
                  # Run with timeout to prevent hangs
                  timeout 60 $UNITTEST_EXE "$test" 2>&1 | tee "${testname}.log" || TEST_EXIT_CODE=$?
                  
                  if [ "${TEST_EXIT_CODE:-0}" -eq 0 ]; then
                    echo "✓ $testname passed"
                  else
                    echo "✗ $testname failed with exit code ${TEST_EXIT_CODE}"
                    echo "This test triggered a failure!"
                    
                    # Try to get more info about the failure
                    if [ "${TEST_EXIT_CODE}" -eq 134 ]; then
                      echo "Exit code 134 indicates assertion failure (SIGABRT)"
                    elif [ "${TEST_EXIT_CODE}" -eq 139 ]; then
                      echo "Exit code 139 indicates segmentation fault (SIGSEGV)"
                    fi
                    
                    # Show last 50 lines of output
                    echo "Last 50 lines of test output:"
                    tail -n 50 "${testname}.log" || true
                  fi
                fi
              done
              
              # Show any assertion messages from the log
              echo "=========================================="
              echo "Searching for assertion failures in logs..."
              echo "=========================================="
              grep -i "assert\|assertion\|failed\|error\|exception" test_output.log || true
              
              # Additional debugging for the specific assertion we saw
              echo "=========================================="
              echo "Searching for binary_deserializer issues..."
              echo "=========================================="
              grep -i "binary_deserializer\|has_buffered_field\|deserializ" test_output.log || true
              
              # Upload any crash dumps as artifacts
              if [ -d "$TEMP/CrashDumps" ] && [ "$(ls -A $TEMP/CrashDumps)" ]; then
                echo "Crash dumps found, preparing for upload..."
                zip -r crash_dumps.zip "$TEMP/CrashDumps"
              fi
            fi
          fi
          
      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-crash-dumps
          path: |
            crash_dumps.zip
            test_output.log
            http_sqlite_*.test.log
          retention-days: 7
          
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.3.0
    with:
      duckdb_version: v1.3.0
      extension_name: sqlite_scanner
      ci_tools_version: v1.3.0

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.3.0
    secrets: inherit
    with:
      duckdb_version: v1.3.0
      extension_name: sqlite_scanner
      ci_tools_version: v1.3.0
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
