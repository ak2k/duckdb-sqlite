name: SQLite Tests
on: 
  push:
  pull_request:
  repository_dispatch:
  merge_group:

jobs:
  linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      CC: 'ccache gcc'
      CXX: 'ccache g++'
      CCACHE_DIR: ${{ github.workspace }}/ccache

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Install required ubuntu packages
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
        sudo apt-get update -y -q -o=Dpkg::Use-Pty=0
        sudo apt-get install -y -q -o=Dpkg::Use-Pty=0 \
          build-essential \
          libcurl4-openssl-dev \
          libssl-dev \
          ccache \
          cmake \
          ninja-build \
          python3

    - name: Install rclone
      run: |
        # apt's rclone predates `serve s3`; install a pinned recent build for the rclone-backed tests.
        curl -fsSL https://downloads.rclone.org/v1.74.2/rclone-v1.74.2-linux-amd64.zip -o /tmp/rclone.zip
        sudo unzip -oj /tmp/rclone.zip '*/rclone' -d /usr/local/bin
        rclone version

    - name: Cache Key
      id: cache_key
      working-directory: ./duckdb
      run: |
        DUCKDB_VERSION=$(git rev-parse --short HEAD)
        KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"
        echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

    - name: Restore Cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Build extension
      run: |
        make release

    - name: Save Cache
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Test extension
      env:
        LOCAL_EXTENSION_REPO: ${{ github.workspace }}/build/release/repository/
        SQLITE_TPCH_GENERATED: 1
      run: |
        make data/db/tpch.db
        # Wrap the unittest binary with the local HTTP server so the remote-SQLite tests
        # (require-env SQLITE_HTTP_TEST_URL) run instead of skipping. Run them the same way locally:
        #   python3 scripts/sqlite_http_test_server.py ./build/release/test/unittest 'test/*'
        # The concurrency + s3 tests gate on other env vars and skip here; they run in the steps below.
        python3 scripts/sqlite_http_test_server.py ./build/release/test/unittest 'test/*'

    - name: Test concurrency (rclone serve http)
      run: |
        # The concurrent-lifecycle test overwhelms the stdlib test server; rclone serve http is a robust
        # Go server that handles it. --server rclone-http sets SQLITE_HTTP_ROBUST so the test runs here.
        python3 scripts/sqlite_http_test_server.py --server rclone-http \
          ./build/release/test/unittest 'test/sql/scanner/http_sqlite_15_concurrent_lifecycle.test'

    - name: Test s3:// path (rclone serve s3)
      run: |
        # Exercise the s3:// transport + the credentialed -wal/-journal sidecar probe via rclone serve s3.
        python3 scripts/sqlite_http_test_server.py --server rclone-s3 \
          ./build/release/test/unittest 'test/sql/scanner/http_sqlite_16_s3.test'

  linux-sanitized:
    name: Linux ${{ matrix.sanitizer.name }} (amd64)
    needs: linux
    runs-on: ubuntu-latest

    strategy:
      matrix:
        sanitizer:
        - name: ASan
          threadsan_enabled: 0
        - name: TSan
          threadsan_enabled: 1

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      GEN: ninja
      CC: 'ccache gcc'
      CXX: 'ccache g++'
      CCACHE_DIR: ${{ github.workspace }}/ccache

    steps:

    - name: Free disk space
      uses: endersonmenezes/free-disk-space@v2.1.1
      continue-on-error: true
      with:
        remove_haskell: true
        remove_tool_cache: true
        remove_folders: "/usr/local/share/powershell /usr/share/swift"
        testing: false

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Install required ubuntu packages
      run: |
        sudo apt-get update -y -q -o=Dpkg::Use-Pty=0
        sudo apt-get install -y -q -o=Dpkg::Use-Pty=0 \
          build-essential \
          libcurl4-openssl-dev \
          libssl-dev \
          ccache \
          cmake \
          mold \
          ninja-build \
          python3

    - name: Install rclone
      run: |
        # apt's rclone predates `serve s3`; install a pinned recent build for the rclone-backed tests.
        curl -fsSL https://downloads.rclone.org/v1.74.2/rclone-v1.74.2-linux-amd64.zip -o /tmp/rclone.zip
        sudo unzip -oj /tmp/rclone.zip '*/rclone' -d /usr/local/bin
        rclone version

    - name: Cache Key
      id: cache_key
      working-directory: ./duckdb
      run: |
        DUCKDB_VERSION=$(git rev-parse --short HEAD)
        KEY="${{ runner.os }}-${{ runner.arch }}-$DUCKDB_VERSION"-relassert-${{ matrix.sanitizer.name }}
        echo "value=${KEY}" >> "${GITHUB_OUTPUT}"

    - name: Restore Cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Build extension
      env:
        THREADSAN: ${{ matrix.sanitizer.threadsan_enabled }}
      run: |
        make relassert
        cat ./build/relassert/build.ninja | grep fsanitize | head -n 1

    - name: Save Cache
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/ccache
        key: ${{ steps.cache_key.outputs.value }}

    - name: Test extension
      env:
        LOCAL_EXTENSION_REPO: ${{ github.workspace }}/build/relassert/repository/
      run: |
        # Run under the local HTTP server so the remote-SQLite tests run (not skipped) under the
        # sanitizers -- this is what exercises the VFS lifetime/refcount paths under ASan/TSan.
        python3 scripts/sqlite_http_test_server.py ./build/relassert/test/unittest

    - name: Test concurrency under sanitizer (rclone serve http)
      run: |
        # The concurrent-lifecycle test under the sanitizers: many contexts register/open/scan/unregister
        # at once, contending the shared VFS registry to surface data races or use-after-free in the
        # retire-then-reap machinery. Served by rclone serve http, which handles the concurrency.
        python3 scripts/sqlite_http_test_server.py --server rclone-http \
          ./build/relassert/test/unittest 'test/sql/scanner/http_sqlite_15_concurrent_lifecycle.test'
